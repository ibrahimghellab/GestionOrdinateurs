services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: GestionOrdinateursDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Émetteur des tokens toujours http://localhost:8180, que l'appel vienne du navigateur ou d'un conteneur
      KC_HOSTNAME: http://localhost:8180
      # Les conteneurs joignent Keycloak par http://keycloak:8080 (récupération des clés de signature)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - appnet

  authentification-api:
    image: ${DOCKER_ACCOUNT}/authentificationapi:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    container_name: authentification_api
    ports:
      - "5198:5198"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5198
      # Secret lu dans le .env (non versionné) : remplace Keycloak:ClientSecret de appsettings.json
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - postgres
      - keycloak
      - gestionordinateurs-api
    networks:
      - appnet

  gestionordinateurs-api:
    image: ${DOCKER_ACCOUNT}/gestionordinateurs-api:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    container_name: gestionordinateurs_api
    ports:
      - "5169:5169"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5169
    networks:
      - appnet

  gestionordinateurs-gateway:
    image: ${DOCKER_ACCOUNT}/gestionordinateurs-gateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    container_name: gestionordinateurs_gateway
    ports:
      - "5010:5010"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5010
    depends_on:
      - gestionordinateurs-api
    networks:
      - appnet

  gestionordinateurs-client:
    image: ${DOCKER_ACCOUNT}/gestionordinateurs-client:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    container_name: gestionordinateurs_client
    ports:
      - "5000:5000"
    depends_on:
      - authentification-api
      - gestionordinateurs-gateway
    networks:
      - appnet

volumes:
  postgres_data:
  keycloak_data:

networks:
  appnet:
